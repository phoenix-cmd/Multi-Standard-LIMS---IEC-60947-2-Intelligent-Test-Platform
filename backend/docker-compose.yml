version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lims-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lims_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lims-redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: lims-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: lims-mailpit
    restart: always
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

  pgadmin:
    image: dpage/pgadmin4
    container_name: lims-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lab.in
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"

volumes:
  postgres_data:
  minio_data:
